# Context-load tests run without a live PostgreSQL instance.
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.initialization-fail-timeout=-1

# Flyway is exercised only in Testcontainers-based tests.
spring.flyway.enabled=false

# Test-only JWT secret (32+ bytes); the real one comes from the JWT_SECRET environment variable.
app.security.jwt.secret=test-only-secret-test-only-secret-0123456789

# No broker in context-load tests: do not start listeners or create topics (Kafka tests turn them on).
app.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
# Tests without a broker must not wait for one when a booking publishes its event.
spring.kafka.producer.properties.max.block.ms=100

# Origins allowed to call the API from a browser (comma separated).
app.cors.allowed-origins=http://localhost:5173

# Test-only organizer invite code.
app.registration.organizer-invite-code=test-invite-code

# No background jobs in tests: they run the services themselves with a controlled clock.
app.scheduling.enabled=false
