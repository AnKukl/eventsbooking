spring.application.name=eventsbooking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventsbooking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# Minimum time before the event start when a booking can still be cancelled
app.booking.cancellation-notice=24h

# JWT. The secret has NO default on purpose: it must come from the JWT_SECRET environment variable
# (at least 32 bytes). The application refuses to start without it.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=eventsbooking
app.security.jwt.ttl=1h

# Kafka. Booking events go to the booking-events topic; the notifications consumer is idempotent.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.auto-offset-reset=earliest
# If Kafka is down, send() must not hold a booking request for the 60 s default: fail fast, the booking is committed.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

# Browser frontends allowed to call the API (comma separated origins).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Fail fast when the database is down (503) instead of holding request threads for the 30 s default.
spring.datasource.hikari.connection-timeout=3000

# Organizer registration is closed unless an invite code is configured (ORGANIZER_INVITE_CODE, a secret).
app.registration.organizer-invite-code=${ORGANIZER_INVITE_CODE:}

# Background jobs (reminders; later the HOLD expiry). Tests switch them off and call the services directly.
app.scheduling.enabled=true
app.reminders.interval=PT1M

# Bookings: a HOLD keeps its seats for 10 minutes; up to 4 seats per booking; holds are released every 30 seconds.
app.booking.hold-duration=10m
app.booking.max-seats-per-booking=4
app.booking.hold-expiry-interval=PT30S
