spring.application.name=eventsbooking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventsbooking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# Minimum time before the event start when a booking can still be cancelled
app.booking.cancellation-notice=24h

# JWT. The secret has NO default on purpose: it must come from the JWT_SECRET environment variable
# (at least 32 bytes). The application refuses to start without it.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=eventsbooking
app.security.jwt.ttl=PT15M
# Refresh token (HttpOnly cookie on /api/auth): lifetime, and how recent a rotation must be for a reused token to
# count as a race between tabs rather than theft.
app.security.refresh.ttl=P14D
app.security.refresh.reuse-grace=PT10S
# Secure session cookies; switch off only for a local run over plain http (APP_SECURITY_COOKIE_SECURE=false).
app.security.cookie.secure=true

# Kafka. Booking events go to the booking-events topic; the notifications consumer is idempotent.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.auto-offset-reset=earliest
# If Kafka is down, send() must not hold a booking request for the 60 s default: fail fast, the booking is committed.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

# Browser frontends allowed to call the API (comma separated origins).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Fail fast when the database is down (503) instead of holding request threads for the 30 s default.
spring.datasource.hikari.connection-timeout=3000

# Organizer registration is closed unless an invite code is configured (ORGANIZER_INVITE_CODE, a secret).
app.registration.organizer-invite-code=${ORGANIZER_INVITE_CODE:}

# Background jobs (reminders; later the HOLD expiry). Tests switch them off and call the services directly.
app.scheduling.enabled=true
app.reminders.interval=PT1M

# Bookings: a HOLD keeps its seats for 10 minutes; up to 4 seats per booking; holds are released every 30 seconds.
app.booking.hold-duration=10m
app.booking.max-seats-per-booking=4
app.booking.hold-expiry-interval=PT30S

# Organizer cabinet. Uploaded photos live in this directory (in Docker: the mounted volume), up to 8 MB per file.
app.storage.local-dir=${STORAGE_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=50MB

# Idempotency keys: how long they are remembered, and the nightly cleanup of expired ones.
app.idempotency.ttl=PT24H
app.cleanup.idempotency.cron=0 0 3 * * *
app.cleanup.idempotency.batch-size=1000
app.cleanup.idempotency.pause=PT0.1S

# Orphaned uploads: PENDING rows and files without a row, older than the grace period. Dry run until switched off.
app.cleanup.orphans.cron=0 30 3 * * *
app.cleanup.orphans.grace=PT24H
app.cleanup.orphans.dry-run=${CLEANUP_ORPHANS_DRY_RUN:true}
app.cleanup.orphans.batch-size=500

# Login, registration and refresh: at most this many attempts per period, per client address and per email (in memory,
# per instance).
app.security.rate-limit.attempts=10
app.security.rate-limit.period=PT1M

# A stable key order in /v3/api-docs, so the docs/openapi.json snapshot only changes when the API does.
springdoc.writer-with-order-by-keys=true
