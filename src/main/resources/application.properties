spring.application.name=eventsbooking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventsbooking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# Minimum time before the event start when a booking can still be cancelled
app.booking.cancellation-notice=24h

# JWT. The secret has NO default on purpose: it must come from the JWT_SECRET environment variable
# (at least 32 bytes). The application refuses to start without it.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=eventsbooking
app.security.jwt.ttl=1h
