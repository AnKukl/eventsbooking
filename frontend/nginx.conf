server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # six photos of up to 8 MB in one upload
    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # The API on the same origin. The original Host goes along: the backend's CSRF check compares Origin with it.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # hashed build files never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # every other path is a page of the single-page app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
