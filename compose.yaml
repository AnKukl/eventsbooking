services:
  postgres:
    image: postgres:17
    container_name: eventsbooking-postgres
    environment:
      POSTGRES_DB: eventsbooking
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d eventsbooking"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: eventsbooking-kafka
    ports:
      - "127.0.0.1:9092:9092"   # for the application running on the host (localhost:9092), this machine only
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST is for clients on the host machine, INTERNAL is for other containers (kafka:19092)
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # the default 1 GB heap is far more than one dev broker needs; WSL often has only 2-3 GB for all containers
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s   # a slow laptop needs more than a minute for the broker

  app:
    build: .
    image: eventsbooking:latest
    container_name: eventsbooking-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # No default on purpose: without JWT_SECRET compose refuses to start (and so does the application).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 bytes), see CLAUDE.md}
      DB_URL: jdbc:postgresql://postgres:5432/eventsbooking
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Secret that lets a registration become ORGANIZER; empty = nobody can register as an organizer.
      ORGANIZER_INVITE_CODE: ${ORGANIZER_INVITE_CODE:-}
      # The orphan file cleanup only counts until this is set to false (see docs/operations.md).
      CLEANUP_ORPHANS_DRY_RUN: ${CLEANUP_ORPHANS_DRY_RUN:-true}
    volumes:
      - uploads:/app/data/uploads   # photos uploaded by organizers survive a container restart
    healthcheck:
      # the JRE image has no curl; bash (not sh) is needed for /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s  # a slow laptop (2 cores for WSL) takes minutes to start Spring


  # The web interface: http://localhost:8090 (FRONTEND_PORT). nginx serves the build and forwards /api to app.
  frontend:
    build: ./frontend
    image: eventsbooking-frontend:latest
    container_name: eventsbooking-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8090}:80"

volumes:
  pgdata:
  uploads:
