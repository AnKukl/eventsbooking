services:
  postgres:
    image: postgres:17
    container_name: eventsbooking-postgres
    environment:
      POSTGRES_DB: eventsbooking
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d eventsbooking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
