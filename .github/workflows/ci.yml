name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers (PostgreSQL, Kafka) uses the Docker available on ubuntu-latest.
      # The JWT secret is not needed: tests bring their own test-only value.
      - name: Build and test
        run: ./mvnw -B verify
