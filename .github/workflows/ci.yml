name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers (PostgreSQL, Kafka) uses the Docker available on ubuntu-latest.
      # The JWT secret is not needed: tests bring their own test-only value.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # the committed API types must match the committed contract snapshot (docs/openapi.json)
      - name: API types are up to date
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORGANIZER_INVITE_CODE: e2e-invite-code
      E2E_INVITE_CODE: e2e-invite-code
      E2E_BASE_URL: http://localhost:8090
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (database, Kafka, backend, frontend)
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fs http://localhost:8090/api/events > /dev/null && break
            sleep 5
          done
          curl -fs http://localhost:8080/actuator/health

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: JWT_SECRET=unused-but-required-0123456789abcdef docker compose logs --tail 200
