<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кабинет: Профиль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font:inherit}
.card{background: #F4EAD9; border-radius: 18px; padding: 22px; box-sizing: border-box; color: #2E241D; box-shadow: 0 14px 24px rgba(20,12,6,0.35), 0 2px 4px rgba(20,12,6,0.2), inset 0 1px 0 rgba(255,255,255,0.7)}
.field{display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6E5A48}
.input{padding: 12px 14px; border-radius: 10px; border: 1px solid #C9B497; background: #FFFFFF; font: inherit; font-size: 15px; color: #2E241D; box-sizing: border-box}
</style>
</helmet>
<div style="width: 1280px; height: 900px; box-sizing: border-box; padding: 32px 48px; background: linear-gradient(180deg, #F3EADB 0%, #E2CFB3 55%, #C9AE8C 100%); color: #2E241D; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <a href="#" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #2E241D"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><mask id="ebm-L"><rect width="40" height="40" rx="9" fill="#FFFFFF"/><circle cx="0" cy="20" r="4.5" fill="#000000"/><circle cx="40" cy="20" r="4.5" fill="#000000"/></mask><rect width="40" height="40" rx="9" fill="#B5563A" mask="url(#ebm-L)"/><rect x="13" y="11" width="3.2" height="18" fill="#F4EAD9"/><rect x="13" y="11" width="14" height="3.2" fill="#F4EAD9"/><rect x="13" y="18.4" width="11" height="3.2" fill="#F4EAD9"/><rect x="13" y="25.8" width="14" height="3.2" fill="#F4EAD9"/></svg><span style="font-family: Fraunces, serif; font-size: 24px; font-weight: 600">Events Booking</span></a>
    <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; background: #E8D9C0; color: #2E241D; border-radius: 999px; font-weight: 600; font-size: 14px; text-decoration: none"><span style="width: 30px; height: 30px; border-radius: 50%; background: #D9C7AE; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7.5 8 2.5l6 5V14h-4v-4H6v4H2z" fill="#2E241D"/></svg></span>Главная</a>
  </header>

  <div style="display: grid; grid-template-columns: 220px 1fr; gap: 24px; flex: 1">
    <nav style="display: flex; flex-direction: column; gap: 6px">
      <button style="text-align: left; padding: 12px 14px; border: none; border-radius: 12px; background: transparent; color: #2E241D; font-size: 15px">Мои брони</button>
      <button style="text-align: left; padding: 12px 14px; border: none; border-radius: 12px; background: transparent; color: #2E241D; font-size: 15px">Избранное · 4</button>
      <button style="text-align: left; padding: 12px 14px; border: none; border-radius: 12px; background: #3A2C22; color: #F4EAD9; font-weight: 600; font-size: 15px">Профиль</button>
      <button style="text-align: left; padding: 12px 14px; border: none; border-radius: 12px; background: transparent; color: #2E241D; font-size: 15px">Уведомления · 3</button>
      <button style="margin-top: auto; text-align: left; padding: 12px 14px; border: none; border-radius: 12px; background: transparent; color: #B5563A; font-size: 15px">Выйти</button>
    </nav>

    <main style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; min-width: 0; align-content: start">
      <div class="card" style="display: flex; flex-direction: column; gap: 16px">
        <span style="font-family: Fraunces, serif; font-size: 26px">Личные данные</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
          <label class="field">Имя<input class="input" value="Антон"></label>
          <label class="field">Город<input class="input" value="Sopot"></label>
          <label class="field" style="grid-column: 1 / span 2">Email<div style="display: flex; gap: 10px; align-items: center"><input class="input" value="anton@example.com" style="flex: 1"><span style="font-size: 12px; font-weight: 600; color: #1E6B66; background: #DDEBE8; padding: 6px 10px; border-radius: 999px">Подтверждён</span></div></label>
          <label class="field">Телефон<input class="input" value="+48 ··· ··· ···"></label>
          <div class="field">Язык интерфейса
            <div style="display: flex; gap: 6px; background: #E8D9C0; padding: 4px; border-radius: 999px; width: fit-content">
              <button style="padding: 8px 14px; border: none; border-radius: 999px; background: #16201E; color: #F4EAD9; font-size: 13px; cursor: pointer">RU</button>
              <button style="padding: 8px 14px; border: none; border-radius: 999px; background: transparent; color: #2E241D; font-size: 13px; cursor: pointer">EN</button>
              <button style="padding: 8px 14px; border: none; border-radius: 999px; background: transparent; color: #2E241D; font-size: 13px; cursor: pointer">PL</button>
            </div>
          </div>
        </div>
        <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 13px; color: #6E5A48">Изменения не сохранены</span>
          <button style="padding: 12px 18px; background: #16201E; color: #EEF1EC; border: none; border-radius: 10px; font-weight: 600; cursor: pointer">Сохранить</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 18px">
        <div class="card" style="display: flex; flex-direction: column; gap: 12px">
          <span style="font-family: Fraunces, serif; font-size: 22px">Пароль</span>
          <span style="font-size: 14px; color: #6E5A48">Последний вход: сегодня, 14:05, Сопот</span>
          <button style="align-self: flex-start; padding: 10px 16px; border: 1px solid #2E241D; background: transparent; color: #2E241D; border-radius: 10px; cursor: pointer; font-size: 14px">Сменить пароль</button>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 12px">
          <span style="font-family: Fraunces, serif; font-size: 22px">Уведомления</span>
          <div style="display: flex; justify-content: space-between; font-size: 15px"><span>Напоминание за 2 часа</span><span style="width: 42px; height: 24px; border-radius: 999px; background: #16201E; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #F4EAD9"></span></span></div>
          <div style="display: flex; justify-content: space-between; font-size: 15px"><span>Письма о новых событиях</span><span style="width: 42px; height: 24px; border-radius: 999px; background: #C9B497; position: relative"><span style="position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></div>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 10px; background: transparent; box-shadow: none; border: 1px solid #C98C6E">
          <span style="font-size: 14px; font-weight: 600; color: #8A3D26">Удалить аккаунт</span>
          <span style="font-size: 13px; color: #6E5A48">Брони сохраняются в истории, но войти будет нельзя. Действие необратимо.</span>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
