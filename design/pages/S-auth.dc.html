<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход и регистрация</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font:inherit}
.input{padding: 13px 14px; border-radius: 12px; border: 1px solid #C9B497; background: #FFFFFF; font: inherit; font-size: 15px; box-sizing: border-box; width: 100%; color: #2E241D}
.lbl{font-size: 13px; color: #4A3B2C; display: flex; flex-direction: column; gap: 6px}
</style>
</helmet>
<div style="width: 1280px; height: 900px; box-sizing: border-box; background: linear-gradient(180deg, #F3EADB 0%, #E2CFB3 55%, #C9AE8C 100%); color: #2E241D; font-family: Inter, sans-serif; display: grid; grid-template-columns: 1fr 520px">
  <section style="position: relative; overflow: hidden; border-radius: 0 0 0 0">
    <img src="/_blob/c8f4db636128cb0b0c1bba92f0c6ed92" alt="Гора Фудзи, озеро и цветущая сакура" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
    <figure role="note" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 480px; margin: 0; background: rgba(255,255,255,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.7); border-radius: 20px; padding: 28px 30px; box-sizing: border-box; text-align: center">
      <blockquote style="margin: 0; font-family: Fraunces, serif; font-size: 22px; line-height: 1.35; color: #16201E">«{{quote.text}}»</blockquote>
      <figcaption style="margin-top: 14px; font-size: 13px; color: #4A3B2C">{{quote.author}}</figcaption>
    </figure>
  </section>

  <section style="padding: 48px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; justify-content: center">
    <span style="font-family: Fraunces, serif; font-size: 24px; font-weight: 600">Events Booking</span>
    <div style="display: flex; gap: 6px; background: #E8D9C0; padding: 4px; border-radius: 999px; width: fit-content">
      <button style="padding: 9px 18px; border: none; border-radius: 999px; background: #16201E; color: #F4EAD9; font-size: 14px; cursor: pointer">Вход</button>
      <button style="padding: 9px 18px; border: none; border-radius: 999px; background: transparent; color: #2E241D; font-size: 14px; cursor: pointer">Регистрация</button>
    </div>
    <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 600; font-size: 40px">С возвращением</h1>

    <label class="lbl">Email<input class="input" value="anton@example.com"></label>
    <label class="lbl">Пароль<input class="input" type="password" value="••••••••"></label>
    <div style="display: flex; justify-content: space-between; font-size: 13px"><label style="display: flex; gap: 8px; align-items: center"><input type="checkbox" checked> Запомнить меня</label><span style="color: #B5563A; text-decoration: underline">Забыли пароль?</span></div>
    <button style="padding: 15px; background: #16201E; color: #EEF1EC; border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer">Войти</button>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #6E5A48"><span style="flex: 1; height: 1px; background: #C9B497"></span>или<span style="flex: 1; height: 1px; background: #C9B497"></span></div>
    <button style="padding: 13px; border: 1px solid #2E241D; background: transparent; color: #2E241D; border-radius: 12px; font-size: 15px; cursor: pointer">Продолжить через Google</button>
    <span style="font-size: 12px; color: #6E5A48; line-height: 1.5">Нажимая «Войти», вы принимаете условия использования и политику конфиденциальности.</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const quotes = [
{ text: 'Искусство — ложь, которая помогает нам увидеть правду.', author: 'Пабло Пикассо' },
{ text: 'Я вложил в работу сердце и душу и в процессе потерял рассудок.', author: 'Винсент ван Гог' },
{ text: 'Творчество требует смелости.', author: 'Анри Матисс' },
{ text: 'Я беру глыбу мрамора и отсекаю всё лишнее.', author: 'Огюст Роден' },
{ text: 'Живопись — это поэзия, которую видят, а не чувствуют; поэзия — это живопись, которую чувствуют, а не видят.', author: 'Леонардо да Винчи' }
];
const q = quotes[Math.floor(Math.random() * quotes.length)];
return { quote: q };
}
}
</script>
</body>
</html>
